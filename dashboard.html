<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mon tableau de bord</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <div class="brand" style="margin:0">JPLE <b>Technicien</b></div>
  <button class="btn ghost" id="logout">Se déconnecter</button>
</header>
<main class="dash">
  <section>
    <h1 id="hello">Bonjour</h1>
    <p style="color:var(--muted)">Voici votre espace personnel.</p>
    <p style="widh:3cm; height:20px; background-color:yellow; border:2px solid blue; border-radius:5px"> <a href="accueil.html">LA BOUTIQUE JP</a></p>
  </section>
  <section class="stats">
    <div class="card"><strong id="email">–</strong><p>Email</p></div>
    <div class="card"><strong id="since">–</strong><p>Membre depuis</p></div>
    <div class="card"><strong id="last">–</strong><p>Dernière connexion</p></div>
    <div class="card"><strong id="count">0</strong><p>Notes enregistrées</p></div>
  </section>
  <section class="card">
    <h2>Mes notes</h2>
    <form id="noteForm">
      <label for="note">Nouvelle note</label>
      <textarea id="note" rows="2" required></textarea>
      <button class="btn" type="submit" style="width:auto;padding:.6rem 1.2rem">Ajouter la note</button>
    </form>
    <div id="notes" style="margin-top:1rem"></div>
  </section>
  <section class="card">
    <h2>Mon profil</h2>
    <form id="profileForm">
      <label for="name">Nom complet</label><input id="name" required>
      <label for="np">Nouveau mot de passe (laisser vide pour ne pas changer)</label>
      <input id="np" type="password" minlength="8" autocomplete="new-password">
      <button class="btn" type="submit" style="width:auto;padding:.6rem 1.2rem">Enregistrer</button>
    </form>
    <div id="msg" class="msg" hidden></div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
